<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a9232f">
  <meta name="description" content="2026年11月底订婚宴的任务、预算、决定与待确认事项总览">
  <title>订婚宴总控台</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a9232f'/%3E%3Cpath d='M17 33l10 10 20-23' fill='none' stroke='%23f8d985' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --red: #a9232f;
      --red-dark: #741722;
      --red-soft: #f8e8e9;
      --gold: #b7771f;
      --gold-soft: #fff2cf;
      --ink: #261f1e;
      --muted: #706664;
      --line: #e7dedb;
      --paper: #fffdfb;
      --page: #f5f1ee;
      --green: #246b4a;
      --green-soft: #e7f4ec;
      --amber: #91530f;
      --amber-soft: #fff0d8;
      --shadow: 0 16px 42px rgba(67, 36, 31, .09);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 4% 0%, rgba(169, 35, 47, .08), transparent 34rem),
        var(--page);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.65;
    }

    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }

    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(16px);
      background: rgba(255, 253, 251, .9);
      border-bottom: 1px solid rgba(231, 222, 219, .85);
    }
    .topbar-inner {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; }
    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: #fff7e6;
      background: var(--red);
      box-shadow: 0 7px 16px rgba(169, 35, 47, .22);
    }
    .updated { color: var(--muted); font-size: .86rem; white-space: nowrap; }

    .hero { padding: 34px 0 20px; }
    .hero-grid { display: grid; grid-template-columns: 1.4fr .8fr; gap: 18px; }
    .hero-main, .countdown {
      border-radius: 26px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .hero-main {
      position: relative;
      padding: 30px;
      color: #fff;
      background: linear-gradient(135deg, var(--red-dark), var(--red) 62%, #bf4750);
    }
    .hero-main::after {
      content: "囍";
      position: absolute;
      right: 18px;
      bottom: -40px;
      color: rgba(255, 238, 192, .12);
      font-family: serif;
      font-size: 12rem;
      line-height: 1;
    }
    .eyebrow { margin: 0 0 8px; color: #f8d985; font-weight: 700; letter-spacing: .12em; }
    h1 { position: relative; z-index: 1; margin: 0; font-size: clamp(2rem, 4.4vw, 3.5rem); line-height: 1.18; }
    .hero-copy { position: relative; z-index: 1; max-width: 42rem; margin: 14px 0 0; color: rgba(255,255,255,.86); }
    .hero-tags { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 9px; margin-top: 22px; }
    .hero-tag { padding: 7px 12px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; background: rgba(255,255,255,.1); font-size: .9rem; }

    .countdown { padding: 26px; background: linear-gradient(145deg, #fffdfb, #fff7e4); border: 1px solid #f3dfb0; }
    .countdown small { color: var(--gold); font-weight: 800; letter-spacing: .08em; }
    .countdown strong { display: block; margin: 4px 0; color: var(--red-dark); font-family: Georgia, serif; font-size: clamp(2.2rem, 7vw, 4.4rem); line-height: 1; }
    .countdown p { margin: 12px 0 0; color: var(--muted); }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 4px 0 26px; }
    .stat { padding: 19px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); }
    .stat-label { color: var(--muted); font-size: .87rem; }
    .stat-value { margin-top: 4px; font-size: 1.45rem; font-weight: 850; line-height: 1.3; }
    .stat-note { margin-top: 4px; color: var(--muted); font-size: .8rem; }

    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 22px; align-items: start; padding-bottom: 72px; }
    main { min-width: 0; }
    aside { position: sticky; top: 84px; }
    .card { margin-bottom: 18px; padding: 24px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 22px rgba(67,36,31,.04); }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 18px; }
    h2 { margin: 0; font-size: 1.38rem; line-height: 1.3; }
    .section-note { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }

    .priority-list { display: grid; gap: 11px; }
    .task {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 13px;
      align-items: start;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #fff;
    }
    .task-badge, .chip { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; font-weight: 800; white-space: nowrap; }
    .task-badge { min-width: 41px; padding: 4px 8px; font-size: .78rem; color: var(--red-dark); background: var(--red-soft); }
    .task h3 { margin: 0; font-size: 1rem; }
    .task p { margin: 5px 0 0; color: var(--muted); font-size: .9rem; }
    .due { color: var(--red-dark); font-size: .84rem; font-weight: 750; text-align: right; }

    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .filter-btn { padding: 8px 13px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: #fff; font: inherit; font-size: .88rem; cursor: pointer; }
    .filter-btn[aria-pressed="true"] { color: #fff; border-color: var(--red); background: var(--red); }

    .task-table { display: grid; gap: 10px; }
    .task-row { display: grid; grid-template-columns: 72px minmax(120px, .85fr) minmax(180px, 1.4fr) 92px; gap: 12px; align-items: center; padding: 14px 15px; border: 1px solid var(--line); border-radius: 14px; }
    .task-row[hidden] { display: none; }
    .task-title { font-weight: 760; }
    .task-action { color: var(--muted); font-size: .87rem; }
    .owner { color: var(--muted); font-size: .83rem; text-align: right; }
    .chip { width: max-content; padding: 4px 9px; font-size: .76rem; }
    .chip-p0 { color: var(--red-dark); background: var(--red-soft); }
    .chip-p1 { color: var(--amber); background: var(--amber-soft); }
    .chip-p2 { color: #385d7c; background: #e7f1f8; }
    .chip-done { color: var(--green); background: var(--green-soft); }
    .chip-pending { color: var(--amber); background: var(--amber-soft); }

    .money-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .money-item { padding: 16px; border: 1px solid var(--line); border-radius: 14px; }
    .money-top { display: flex; justify-content: space-between; gap: 12px; }
    .money-name { font-weight: 760; }
    .money-value { color: var(--red-dark); font-weight: 850; }
    .money-item p { margin: 8px 0 0; color: var(--muted); font-size: .86rem; }
    .budget-warning { margin-top: 14px; padding: 14px 16px; border-left: 4px solid var(--gold); border-radius: 10px; background: var(--gold-soft); color: #62410c; font-size: .9rem; }

    .decision-list, .question-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .decision-list li, .question-list li { position: relative; padding: 13px 14px 13px 43px; border: 1px solid var(--line); border-radius: 13px; background: #fff; }
    .decision-list li::before, .question-list li::before { position: absolute; left: 14px; top: 13px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; font-weight: 900; line-height: 1; }
    .decision-list li::before { content: "✓"; color: var(--green); background: var(--green-soft); }
    .question-list li::before { content: "?"; color: var(--amber); background: var(--amber-soft); }
    .decision-list strong { display: block; }
    .decision-list span { color: var(--muted); font-size: .88rem; }

    .side-nav { padding: 14px; }
    .side-nav a { display: block; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: var(--muted); font-weight: 650; }
    .side-nav a:hover, .side-nav a:focus-visible { color: var(--red-dark); background: var(--red-soft); outline: none; }
    .aside-title { margin: 3px 10px 8px; color: var(--ink); font-size: .86rem; font-weight: 850; }
    .next-step { padding: 20px; color: #fff; background: var(--red-dark); }
    .next-step h2 { font-size: 1.1rem; }
    .next-step p { margin: 9px 0 0; color: rgba(255,255,255,.76); font-size: .9rem; }

    body.locked { overflow: hidden; }
    .access-gate {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at 10% 5%, rgba(248, 217, 133, .18), transparent 28rem),
        linear-gradient(145deg, var(--red-dark), #3e1118);
    }
    .access-gate[hidden] { display: none; }
    .gate-card {
      width: min(100%, 420px);
      padding: 30px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 24px;
      color: #fff;
      background: rgba(255,255,255,.1);
      box-shadow: 0 24px 70px rgba(30, 3, 8, .3);
      backdrop-filter: blur(18px);
    }
    .gate-mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px; color: var(--red-dark); background: #f8d985; font-family: serif; font-size: 1.5rem; font-weight: 900; }
    .gate-card h1 { margin: 20px 0 7px; font-size: 1.8rem; }
    .gate-card p { margin: 0 0 22px; color: rgba(255,255,255,.76); }
    .gate-card label { display: block; margin-bottom: 7px; font-size: .9rem; font-weight: 750; }
    .gate-row { display: grid; grid-template-columns: 1fr auto; gap: 9px; }
    .gate-row input {
      min-width: 0;
      padding: 12px 13px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 11px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      outline: none;
    }
    .gate-row input:focus { border-color: #f8d985; box-shadow: 0 0 0 3px rgba(248,217,133,.22); }
    .gate-row button { padding: 12px 17px; border: 0; border-radius: 11px; color: var(--red-dark); background: #f8d985; font: inherit; font-weight: 850; cursor: pointer; }
    .gate-error { min-height: 1.5em; margin: 9px 0 0 !important; color: #ffd5d8 !important; font-size: .88rem; }

    footer { padding: 24px 0 44px; color: var(--muted); text-align: center; font-size: .84rem; }
    section { scroll-margin-top: 84px; }

    @media (max-width: 900px) {
      .hero-grid, .layout { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      aside { position: static; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; order: -1; }
      .side-nav { display: none; }
      .next-step { margin-bottom: 0; }
    }

    @media (max-width: 640px) {
      .shell { width: min(100% - 20px, 1180px); }
      .topbar-inner { min-height: 58px; }
      .brand-mark { width: 31px; height: 31px; }
      .updated { display: none; }
      .hero { padding-top: 18px; }
      .hero-main { padding: 24px 20px; border-radius: 20px; }
      .hero-main::after { right: 4px; font-size: 9rem; }
      .countdown { padding: 20px; border-radius: 20px; }
      .stats { gap: 9px; }
      .stat { padding: 14px; border-radius: 14px; }
      .stat-value { font-size: 1.18rem; }
      .card { padding: 18px 14px; border-radius: 16px; }
      .task { grid-template-columns: auto 1fr; }
      .due { grid-column: 2; text-align: left; }
      .task-row { grid-template-columns: 58px 1fr; gap: 7px 10px; }
      .task-action, .owner { grid-column: 2; text-align: left; }
      .money-grid { grid-template-columns: 1fr; }
      aside { display: block; }
      .next-step { margin-bottom: 18px; }
    }
  </style>
</head>
<body class="locked">
  <section class="access-gate" id="access-gate" aria-labelledby="gate-title">
    <form class="gate-card" id="access-form">
      <div class="gate-mark">囍</div>
      <h1 id="gate-title">订婚宴总控台</h1>
      <p>正文已加密，请输入阅览密码后在本机解密查看。</p>
      <label for="access-password">阅览密码</label>
      <div class="gate-row">
        <input id="access-password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit">进入</button>
      </div>
      <p class="gate-error" id="access-error" role="alert" aria-live="polite"></p>
    </form>
  </section>

    const ENCRYPTION_SALT = '3cCeX9yVDtlD25BeHYOr5A==';
    const ENCRYPTION_IV = 'WKpYuUEuc0qLNccV';
    const PBKDF2_ITERATIONS = 250000;
    const accessGate = document.getElementById('access-gate');
    const protectedContent = document.getElementById('protected-content');
    const accessForm = document.getElementById('access-form');
    const accessPassword = document.getElementById('access-password');
    const accessError = document.getElementById('access-error');

    function decodeBase64(value) {
      return Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
    }

    async function decryptContent(password) {
      const encoder = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        'raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']
      );
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: decodeBase64(ENCRYPTION_SALT), iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      const plaintext = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: decodeBase64(ENCRYPTION_IV) },
        key,
        decodeBase64(ENCRYPTED_DATA)
      );
      return new TextDecoder().decode(plaintext);
    }

    function activatePage(html) {
      protectedContent.innerHTML = html;
      protectedContent.hidden = false;
      accessGate.hidden = true;
      document.body.classList.remove('locked');

      const buttons = protectedContent.querySelectorAll('[data-filter]');
      const rows = protectedContent.querySelectorAll('[data-priority]');
      buttons.forEach((button) => {
        button.addEventListener('click', () => {
          const filter = button.dataset.filter;
          buttons.forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
          rows.forEach((row) => { row.hidden = filter !== 'all' && row.dataset.priority !== filter; });
        });
      });
    }

    accessForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      accessError.textContent = '正在解密…';
      try {
        const html = await decryptContent(accessPassword.value);
        accessPassword.value = '';
        activatePage(html);
      } catch (_) {
        accessError.textContent = '密码不正确，请重新输入。';
        accessPassword.select();
      }
    });

    document.addEventListener('contextmenu', (event) => event.preventDefault());
    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (event.key === 'F12' || (event.ctrlKey && key === 'u') ||
          (event.ctrlKey && event.shiftKey && ['i', 'j', 'c'].includes(key))) {
        event.preventDefault();
      }
    });
